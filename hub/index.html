<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Itens do Hub">
      <div class="sidebar-top">
        <button class="icon-button" id="toggleSidebar" type="button" aria-label="Recolher ou expandir menu">
          <span class="hamburger" aria-hidden="true"></span>
        </button>
        <button class="icon-button theme-toggle-btn" id="toggleTheme" type="button" aria-label="Alternar modo noturno">🌙</button>
        <h1 class="brand">Hub</h1>
        <button class="icon-button add-button" id="newItem" type="button" aria-label="Criar item">+</button>
      </div>

      <div class="sidebar-label">Arquivos</div>
      <label class="sidebar-search">
        <span>Buscar</span>
        <input id="sidebarSearch" type="search" placeholder="Projetos, pastas ou arquivos">
      </label>
      <button class="sidebar-trash" id="trashToggle" type="button">
        <span>Lixeira</span>
        <span id="trashCount">0</span>
      </button>
      <div class="backup-menu" aria-label="Backup de dados">
        <div class="backup-title">Dados</div>
        <button class="backup-button" id="exportBackup" type="button">Exportar backup</button>
        <button class="backup-button" id="importBackup" type="button">Importar backup</button>
        <input class="backup-file-input" id="backupFileInput" type="file" accept="application/json,.json">
        <div class="backup-status" id="backupStatus" aria-live="polite"></div>
      </div>
      <nav class="tree-list" id="treeList" aria-label="Árvore de projetos, pastas e documentos"></nav>
      <div class="sidebar-account">
        <div class="account-name" id="accountName"></div>
        <button class="account-logout" id="adminButton" type="button">Admin</button>
        <button class="account-logout" id="logoutButton" type="button">Sair</button>
      </div>
    </aside>

    <main class="main-area">
      <section class="editor-panel" id="editorPanel" aria-live="polite"></section>
    </main>
  </div>

  <aside class="ai-panel" id="aiPanel" aria-label="Assistente de IA">
    <div class="ai-panel-header">
      <strong>Assistente</strong>
      <div class="ai-panel-header-actions">
        <button class="ai-options-toggle" id="aiOptionsToggle" type="button">Opções</button>
        <button class="ai-close" id="aiClose" type="button" aria-label="Fechar assistente">×</button>
      </div>
    </div>
    <div class="ai-options-panel collapsed" id="aiOptionsPanel">
      <div class="ai-key-actions">
        <button class="ai-set-key" id="aiSetKey" type="button">Chave</button>
        <button class="ai-clear-key" id="aiClearKey" type="button">Esquecer</button>
      </div>
      <div class="ai-key-status" id="aiKeyStatus">Chave não configurada</div>
      <p class="ai-local-note">Uso local: a chave fica apenas em memória até recarregar a página.</p>
      <label class="ai-field">
        <span>Modo</span>
        <select class="ai-mode-select" id="aiModeSelect">
          <option value="reply">Só responder</option>
          <option value="suggest">Sugerir alterações</option>
          <option value="confirm">Aplicar com confirmação</option>
          <option value="auto">Aplicar automaticamente</option>
        </select>
      </label>
      <fieldset class="ai-context-options">
        <legend>Contexto</legend>
        <label><input type="checkbox" id="aiContextCurrent" data-ai-context="current"> Página atual</label>
        <label><input type="checkbox" id="aiContextProject" data-ai-context="project"> Projeto inteiro</label>
        <label><input type="checkbox" id="aiContextLinks" data-ai-context="links"> Apenas links da página</label>
        <label><input type="checkbox" id="aiContextBlocks" data-ai-context="blocks"> Apenas Kanban/planilhas</label>
        <label><input type="checkbox" id="aiContextRelated" data-ai-context="related"> Documentos relacionados</label>
        <div class="ai-context-summary" id="aiContextSummary"></div>
      </fieldset>
      <div class="ai-quick-prompts" aria-label="Prompts rápidos">
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Organize esta página em seções claras, mantendo o conteúdo original e sugerindo melhorias.">Organizar página</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Resuma esta página em tópicos objetivos.">Resumir</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Crie um Kanban nesta página com tarefas baseadas no conteúdo atual.">Criar Kanban</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Crie uma checklist prática baseada no conteúdo desta página.">Criar checklist</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Crie uma planilha simples para organizar as informações desta página.">Criar planilha</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Melhore a formatação desta página sem alterar o sentido do conteúdo.">Melhorar formatação</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Transforme este conteúdo em um planejamento de aula estruturado.">Plano de aula</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Gere tópicos objetivos a partir desta página.">Gerar tópicos</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Analise esta página e aponte problemas de organização, clareza ou lacunas.">Encontrar problemas</button>
        <button class="ai-quick-prompt-btn" type="button" data-prompt="Sugira uma estrutura melhor para este projeto/página.">Sugerir estrutura</button>
      </div>
    </div>
    <div class="ai-messages" id="aiMessages"></div>
    <form class="ai-input-area" id="aiForm">
      <textarea id="aiPrompt" placeholder="Peça para organizar esta página, criar estrutura, resumir ou sugerir melhorias..."></textarea>
      <button type="submit">Enviar</button>
    </form>
    <div class="ai-undo-area">
      <button class="ai-undo-button" id="aiUndoLastAction" type="button">Desfazer última ação da IA</button>
    </div>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
