<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Itens do Hub">
      <div class="sidebar-top">
        <button class="icon-button" id="toggleSidebar" type="button" aria-label="Recolher ou expandir menu">
          <span class="hamburger" aria-hidden="true"></span>
        </button>
        <button class="icon-button theme-toggle-btn" id="toggleTheme" type="button" aria-label="Alternar modo noturno">🌙</button>
        <h1 class="brand">Hub</h1>
        <button class="icon-button add-button" id="newItem" type="button" aria-label="Criar item">+</button>
      </div>

      <div class="sidebar-label">Arquivos</div>
      <label class="sidebar-search">
        <span>Buscar</span>
        <input id="sidebarSearch" type="search" placeholder="Projetos, pastas ou arquivos">
      </label>
      <button class="sidebar-trash" id="trashToggle" type="button">
        <span>Lixeira</span>
        <span id="trashCount">0</span>
      </button>
      <nav class="tree-list" id="treeList" aria-label="Árvore de projetos, pastas e documentos"></nav>
      <div class="sidebar-account">
        <div class="account-name" id="accountName"></div>
        <button class="account-logout" id="adminButton" type="button">Admin</button>
        <button class="account-logout" id="logoutButton" type="button">Sair</button>
      </div>
    </aside>

    <main class="main-area">
      <section class="editor-panel" id="editorPanel" aria-live="polite"></section>
    </main>
  </div>

  <aside class="ai-panel" id="aiPanel" aria-label="Assistente de IA">
    <div class="ai-panel-header">
      <strong>Assistente</strong>
      <button class="ai-set-key" id="aiSetKey" type="button">Chave</button>
      <button class="ai-clear-key" id="aiClearKey" type="button">Esquecer</button>
      <button class="ai-close" id="aiClose" type="button" aria-label="Fechar assistente">×</button>
    </div>
    <div class="ai-key-status" id="aiKeyStatus">Chave não configurada</div>
    <p class="ai-local-note">Uso local: a chave fica apenas em memória até recarregar a página.</p>
    <div class="ai-messages" id="aiMessages"></div>
    <form class="ai-input-area" id="aiForm">
      <textarea id="aiPrompt" placeholder="Peça para organizar esta página, criar estrutura, resumir ou sugerir melhorias..."></textarea>
      <button type="submit">Enviar</button>
    </form>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
